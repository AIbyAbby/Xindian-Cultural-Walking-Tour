<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>碧潭畔的清涼往事：195綿綿冰｜走入繪本</title>
    <meta name="description" content="翻閱碧潭畔195綿綿冰與新店老街的地方記憶。">
    <link rel="stylesheet" href="../style.css">
  </head>
  <body class="record-page storybook-page mianmian-picturebook-page">
    <header class="record-hero storybook-hero mianmian-reader-hero">
      <div class="record-hero-copy">
        <a class="back-home" href="../index.html">回到首頁</a>
        <p class="eyebrow">走入繪本・第二個故事</p>
        <h1>碧潭畔的清涼往事：195綿綿冰</h1>
        <p class="record-summary">沿著新店老街，讀一間冰店與一家人守住二十年清甜滋味的故事。</p>
      </div>
    </header>

    <main class="mianmian-reader-layout">
      <section class="mianmian-reader" data-picturebook-reader tabindex="0" aria-label="碧潭畔的清涼往事繪本閱讀器">
        <div class="mianmian-reader-stage">
          <img
            data-reader-image
            src="../assets/images/storybook-mianmian/page-01.webp"
            alt="碧潭畔的清涼往事：195綿綿冰，第 1 頁，共 15 頁"
            width="1376"
            height="768"
            fetchpriority="high"
          >
        </div>

        <div class="mianmian-reader-controls">
          <button type="button" class="mianmian-reader-button" data-reader-previous aria-label="上一頁">← 上一頁</button>
          <div class="mianmian-reader-position">
            <span data-reader-status aria-live="polite">1 / 15</span>
            <div class="mianmian-reader-progress" aria-hidden="true">
              <span data-reader-progress></span>
            </div>
          </div>
          <button type="button" class="mianmian-reader-button" data-reader-next aria-label="下一頁">下一頁 →</button>
        </div>

        <a class="button primary mianmian-reader-home" data-reader-home href="../index.html" hidden>回到首頁</a>

        <div class="mianmian-reader-pages" hidden aria-hidden="true">
          <span data-page-src="../assets/images/storybook-mianmian/page-01.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-02.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-03.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-04.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-05.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-06.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-07.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-08.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-09.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-10.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-11.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-12.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-13.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-14.webp"></span>
          <span data-page-src="../assets/images/storybook-mianmian/page-15.webp"></span>
        </div>
      </section>
      <p class="mianmian-reader-hint">可使用鍵盤方向鍵，手機也能左右滑動翻頁。</p>
    </main>

    <script type="module" src="../assets/js/mianmian-picturebook.js"></script>
  </body>
</html>
