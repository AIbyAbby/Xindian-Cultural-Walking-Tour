<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8e6df"/><stop offset="1" stop-color="#f2d9b8"/></linearGradient>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="24"/><feColorMatrix type="saturate" values="0.3"/><feBlend mode="multiply" in2="SourceGraphic"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.5"/></filter>
    <style>
      .bg{fill:url(#sky)} .river{fill:#6aa39a;opacity:.82}.bank{fill:#91a06d;opacity:.75}.hill{fill:#738a60;opacity:.82}.lane,.path{fill:none;stroke:#dab986;stroke-width:34;stroke-linecap:round;opacity:.72}.houses rect{fill:#b67858;opacity:.78;stroke:#584137;stroke-width:3}.houses polygon{fill:#705040;opacity:.82;stroke:#584137;stroke-width:3}.fig circle{fill:#2e3e48;opacity:.9}.fig path{fill:#38515c;opacity:.76}.rain{fill:none;stroke:#5e7480;stroke-width:5;stroke-linecap:round;opacity:.5}.cloth{fill:#c79a62;opacity:.55;stroke:#7a5a44;stroke-width:3}.tunnel{fill:#263139;opacity:.82}.table ellipse{fill:#b98b5f;opacity:.72}.table circle,.table path{fill:#344d59;opacity:.78}.mist{fill:none;stroke:#fff;stroke-width:42;opacity:.3;filter:url(#soft)}
    </style>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <g filter="url(#paper)"><path class="river" d="M0 385 C170 335 295 430 480 365 C650 305 780 310 960 340 L960 540 L0 540 Z"/><g class="table" transform="translate(330 315)"><ellipse cx="0" cy="0" rx="150" ry="54"/><circle cx="-90" cy="-55" r="12"/><circle cx="-35" cy="-76" r="12"/><circle cx="35" cy="-76" r="12"/><circle cx="92" cy="-54" r="12"/><path d="M-90 -42 l-18 58 h36 z M-35 -62 l-18 60 h36 z M35 -62 l-18 60 h36 z M92 -42 l-18 58 h36 z"/></g><g class="houses" transform="translate(90 215)"><rect x="0" y="50" width="120" height="135"/><polygon points="-12,50 60,8 132,50"/></g><path class="mist" d="M0 145 C190 90 315 165 500 120 C670 78 810 120 960 90"/></g>
