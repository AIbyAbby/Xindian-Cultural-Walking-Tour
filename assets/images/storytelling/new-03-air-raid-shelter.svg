<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8e6df"/><stop offset="1" stop-color="#f2d9b8"/></linearGradient>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="24"/><feColorMatrix type="saturate" values="0.3"/><feBlend mode="multiply" in2="SourceGraphic"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.5"/></filter>
    <style>
      .bg{fill:url(#sky)} .river{fill:#6aa39a;opacity:.82}.bank{fill:#91a06d;opacity:.75}.hill{fill:#738a60;opacity:.82}.lane,.path{fill:none;stroke:#dab986;stroke-width:34;stroke-linecap:round;opacity:.72}.houses rect{fill:#b67858;opacity:.78;stroke:#584137;stroke-width:3}.houses polygon{fill:#705040;opacity:.82;stroke:#584137;stroke-width:3}.fig circle{fill:#2e3e48;opacity:.9}.fig path{fill:#38515c;opacity:.76}.rain{fill:none;stroke:#5e7480;stroke-width:5;stroke-linecap:round;opacity:.5}.cloth{fill:#8a5f44;opacity:.55;stroke:#7a5a44;stroke-width:3}.tunnel{fill:#263139;opacity:.82}.table ellipse{fill:#b98b5f;opacity:.72}.table circle,.table path{fill:#344d59;opacity:.78}.mist{fill:none;stroke:#fff;stroke-width:42;opacity:.3;filter:url(#soft)}
    </style>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <g filter="url(#paper)"><path class="hill" d="M0 540 L0 310 C140 260 240 196 365 145 C525 78 690 55 960 40 L960 540 Z"/><ellipse class="tunnel" cx="315" cy="408" rx="115" ry="88"/><path class="path" d="M340 540 C375 485 425 445 500 398 C590 340 650 295 720 235"/><g class="fig"><circle cx="492" cy="405" r="8"/><path d="M492 414 l-14 45 h28 z"/><circle cx="528" cy="388" r="6"/><path d="M528 396 l-10 32 h20 z"/></g></g>
</svg>
