<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfdedc"/><stop offset="1" stop-color="#e7d4b4"/></linearGradient>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="17"/><feColorMatrix type="saturate" values="0.25"/><feBlend mode="multiply" in2="SourceGraphic"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.3"/></filter>
    <style>
      svg { background: url(#sky); }
      .bg { fill:url(#sky); }
      .river { fill:#5f9f9a; opacity:.82; }
      .bank,.ground { fill:#6f8d5b; opacity:.84; }
      .hill,.mountain path { fill:#6f8d5b; opacity:.78; }
      .lane,.path { fill:none; stroke:#d9b98a; stroke-width:34; stroke-linecap:round; opacity:.72; }
      .houses rect { fill:#b97957; opacity:.78; stroke:#5d463c; stroke-width:3; }
      .houses polygon { fill:#714e3d; opacity:.78; stroke:#5d463c; stroke-width:3; }
      .arcade rect { fill:#b87a58; opacity:.8; stroke:#563f36; stroke-width:3; }
      .arcade polygon { fill:#6a4d3d; opacity:.82; stroke:#563f36; stroke-width:3; }
      .house-large rect { fill:#a96953; opacity:.78; stroke:#4b3b36; stroke-width:4; }
      .house-large polygon { fill:#6d4a3d; opacity:.8; stroke:#4b3b36; stroke-width:4; }
      .figures circle,.figure-alone circle { fill:#2f3f48; opacity:.88; }
      .figures path,.figure-alone path { fill:#344d59; opacity:.76; }
      .arm,.cable,.wave,.rain { fill:none; stroke:#624638; stroke-width:5; stroke-linecap:round; opacity:.62; }
      .mist { fill:none; stroke:#ffffff; stroke-width:42; opacity:.28; filter:url(#soft); }
      .trees circle { fill:#5f7f5d; opacity:.58; } .trees rect { fill:#70543d; opacity:.58; }
      .tunnel { fill:#27323a; opacity:.78; } .box,.buckets rect { fill:#c2a15d; opacity:.75; stroke:#5e4d36; stroke-width:3; }
      .rainwash { fill:#94aab0; opacity:.18; }
    </style>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <g filter="url(#paper)">
      <path class="river" d="M0 360 C180 320 320 430 505 365 C650 315 780 286 960 330 L960 540 L0 540 Z"/>
      <path class="cable" d="M130 180 C330 140 560 130 820 102"/>
      <g class="buckets"><rect x="350" y="145" width="34" height="24"/><rect x="600" y="118" width="36" height="24"/></g>
      <g class="mountain"><path d="M0 320 C120 210 220 170 330 210 C480 95 625 88 780 180 C870 145 925 125 960 118 L960 540 L0 540 Z"/></g>
      <g class="figures"><circle cx="470" cy="415" r="7"/><path d="M470 423 l-18 30 h36 z"/><circle cx="520" cy="398" r="6"/><path d="M520 405 l-15 28 h31 z"/></g>
  </g>
</svg>
