<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg{fill:#fff8df}.title{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-weight:900;fill:#111}.sub{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-weight:700;fill:#222}.h{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-weight:850;fill:#111}.body{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#171717}.pill{fill:#ffd3cf}.pill2{fill:#ffe78b}.line{fill:none;stroke:#333;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.sk{stroke:#333;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.label{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-weight:700;fill:#222}.sign{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-weight:900;fill:#7b2c16}.small{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#222}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <circle cx="1450" cy="110" r="155" fill="#ffe66d" opacity=".75"/>
  <path d="M0 720 C160 650 310 750 500 680 L500 900 L0 900 Z" fill="#ffe66d" opacity=".75"/>
  <path d="M1180 900 C1255 780 1395 690 1600 650 L1600 900 Z" fill="#91d6e5" opacity=".85"/>

  <text x="55" y="82" class="title" font-size="54">蔡班長的青春地圖：1970年代新店街頭遊蹤</text>
  <text x="55" y="132" class="sub" font-size="27">呈現蔡班長國中時期（民國64-66年）在新店老街與光明街一帶的課後休閒生活與地景風貌。</text>

  <!-- decorations -->
  <g transform="translate(1320 35)"><circle cx="36" cy="34" r="25" fill="#f2bd62" stroke="#333" stroke-width="3"/><path d="M10 72 L62 72 M36 34 L25 72 M36 34 L52 72" class="line"/><circle cx="10" cy="72" r="9" fill="#fff" stroke="#333" stroke-width="3"/><circle cx="62" cy="72" r="9" fill="#fff" stroke="#333" stroke-width="3"/></g>
  <g transform="translate(1435 30)"><rect x="0" y="22" width="90" height="65" rx="12" fill="#6eb0d3" stroke="#333" stroke-width="4"/><path d="M24 22 C24 0 66 0 66 22" class="line"/><circle cx="20" cy="90" r="8" fill="#333"/><circle cx="70" cy="90" r="8" fill="#333"/></g>
  <g transform="translate(1500 170)"><rect x="0" y="0" width="95" height="60" rx="10" fill="#f69cac" stroke="#333" stroke-width="4" transform="rotate(15 48 30)"/><circle cx="49" cy="30" r="15" fill="#ffe78b" stroke="#333" stroke-width="3"/></g>

  <!-- left section -->
  <text x="115" y="205" class="h" font-size="38">課後首站：探訪「夭鬼巷」</text>
  <rect x="318" y="178" width="205" height="46" rx="22" class="pill" opacity=".9"/>
  <circle cx="75" cy="185" r="38" fill="#4f75a3"/><path d="M40 210 C65 170 105 170 130 210" fill="#2f557e" stroke="#333" stroke-width="4"/>

  <g transform="translate(60 250)">
    <circle cx="58" cy="58" r="55" fill="#ffd4c7" stroke="#333" stroke-width="4"/>
    <line x1="58" y1="58" x2="58" y2="18" class="line"/><line x1="58" y1="58" x2="88" y2="58" class="line"/>
    <text x="58" y="48" text-anchor="middle" class="label" font-size="18">週三</text><text x="58" y="74" text-anchor="middle" class="label" font-size="18">&amp; 週六</text><text x="58" y="100" text-anchor="middle" class="label" font-size="18">下午</text>
  </g>
  <rect x="170" y="250" width="215" height="42" rx="18" class="pill2"/><text x="278" y="281" text-anchor="middle" class="h" font-size="26">週三與週六的半天自由</text>
  <text x="170" y="325" class="body" font-size="24"><tspan x="170" dy="0">當時國中僅上課半天，下午</tspan><tspan x="170" dy="34">便與同儕在此吃喝遊玩。</tspan></text>

  <!-- ghost lane market -->
  <g transform="translate(70 410)">
    <path d="M0 190 L90 95 L180 190 Z" fill="#d9e6e7" stroke="#333" stroke-width="4"/><rect x="20" y="190" width="140" height="120" fill="#f0d1a3" stroke="#333" stroke-width="4"/><rect x="45" y="212" width="48" height="78" fill="#9fc9d8" stroke="#333" stroke-width="3"/><rect x="100" y="212" width="34" height="78" fill="#c88b60" stroke="#333" stroke-width="3"/>
    <path d="M175 188 L275 110 L375 188 Z" fill="#d4e4ee" stroke="#333" stroke-width="4"/><rect x="195" y="188" width="160" height="120" fill="#f3d8a7" stroke="#333" stroke-width="4"/><rect x="245" y="212" width="55" height="78" fill="#9fc9d8" stroke="#333" stroke-width="3"/>
    <rect x="20" y="165" width="95" height="35" fill="#f4bf5e" stroke="#333" stroke-width="3"/><text x="68" y="191" text-anchor="middle" class="sign" font-size="23">小吃</text>
    <rect x="220" y="164" width="100" height="35" fill="#f4bf5e" stroke="#333" stroke-width="3"/><text x="270" y="190" text-anchor="middle" class="sign" font-size="23">小物</text>
  </g>
  <rect x="360" y="410" width="210" height="42" rx="18" class="pill2"/><text x="465" y="440" text-anchor="middle" class="h" font-size="25">鐵皮屋下的「夭鬼巷」</text>
  <text x="360" y="480" class="body" font-size="22"><tspan x="360" dy="0">由文中路走下的老街，佈滿一格格</tspan><tspan x="360" dy="31">販售小吃、小物與算命的鐵皮攤位。</tspan></text>
  <g transform="translate(485 280)"><rect x="0" y="55" width="90" height="95" fill="#d8b3d8" stroke="#333" stroke-width="4"/><path d="M0 55 L45 10 L90 55 Z" fill="#b984b9" stroke="#333" stroke-width="4"/><text x="45" y="52" text-anchor="middle" class="sign" font-size="24">算命</text><circle cx="45" cy="100" r="18" fill="#ffd4a8" stroke="#333" stroke-width="3"/></g>

  <!-- admin buildings -->
  <g transform="translate(705 165)">
    <rect x="25" y="95" width="100" height="120" fill="#d9e4e8" stroke="#333" stroke-width="4"/><rect x="160" y="55" width="150" height="160" fill="#f1d19f" stroke="#333" stroke-width="4"/><rect x="345" y="80" width="145" height="135" fill="#d9e4e8" stroke="#333" stroke-width="4"/>
    <rect x="185" y="95" width="100" height="120" fill="#cde0e8" stroke="#333" stroke-width="3"/><text x="235" y="82" text-anchor="middle" class="label" font-size="19">區公所</text>
    <text x="70" y="230" text-anchor="middle" class="label" font-size="18">公路局</text><text x="180" y="238" text-anchor="middle" class="label" font-size="18">警察局</text><text x="305" y="238" text-anchor="middle" class="label" font-size="18">戶政事務所</text><text x="420" y="230" text-anchor="middle" class="label" font-size="18">地政事務所</text>
  </g>
  <text x="1230" y="242" class="h" font-size="32">昔日的行政中樞</text>
  <text x="1230" y="292" class="body" font-size="24"><tspan x="1230" dy="0">街道右側座落著公路局、警察局、</tspan><tspan x="1230" dy="34">區公所、戶政及地政事務所。</tspan></text>

  <!-- entertainment section -->
  <rect x="925" y="408" width="468" height="54" rx="24" class="pill"/><text x="1159" y="447" text-anchor="middle" class="h" font-size="36">娛樂重心：光明街與碧潭周邊</text>
  <rect x="825" y="505" width="130" height="56" fill="#f2d39a" stroke="#333" stroke-width="4"/><text x="890" y="542" text-anchor="middle" class="sign" font-size="23">伊士曼戲院</text>
  <rect x="1002" y="505" width="130" height="56" fill="#f2d39a" stroke="#333" stroke-width="4"/><text x="1067" y="542" text-anchor="middle" class="sign" font-size="23">碧潭戲院</text>
  <text x="890" y="588" text-anchor="middle" class="body" font-size="22">伊士曼戲院</text><text x="1067" y="588" text-anchor="middle" class="body" font-size="22">碧潭戲院</text>
  <text x="1067" y="616" text-anchor="middle" class="body" font-size="18">（碧潭市場上方）</text>
  <rect x="815" y="640" width="250" height="90" fill="#7aa875" stroke="#333" stroke-width="5"/><circle cx="890" cy="682" r="9" fill="#c54b3c"/><circle cx="918" cy="682" r="9" fill="#fff"/><circle cx="946" cy="682" r="9" fill="#222"/>
  <rect x="805" y="452" width="205" height="42" rx="18" class="pill2"/><text x="908" y="482" text-anchor="middle" class="h" font-size="25">兩大戲院與撞球生活</text>
  <text x="805" y="770" class="body" font-size="22"><tspan x="805" dy="0">穿梭於光明街的伊士曼戲院</tspan><tspan x="805" dy="31">與碧潭戲院看電影、打撞球。</tspan></text>

  <g transform="translate(1210 570)">
    <path d="M40 190 L180 75 L320 190" fill="none" stroke="#333" stroke-width="5"/><line x1="180" y1="75" x2="180" y2="270" class="line"/><line x1="95" y1="146" x2="265" y2="270" class="line"/><line x1="265" y1="146" x2="95" y2="270" class="line"/>
    <path d="M0 290 C90 250 145 300 230 260 C305 225 355 250 400 230 L400 330 L0 330 Z" fill="#91d6e5"/>
    <path d="M420 110 C455 140 455 185 420 220" class="line"/>
    <g transform="translate(20 130)"><rect x="0" y="80" width="80" height="75" fill="#f1c278" stroke="#333" stroke-width="4"/><path d="M0 80 L40 50 L80 80 Z" fill="#e78355" stroke="#333" stroke-width="4"/></g>
  </g>
  <rect x="1255" y="505" width="250" height="42" rx="18" class="pill2"/><text x="1380" y="535" text-anchor="middle" class="h" font-size="25">往碧潭吊橋的熱鬧攤位</text>
  <text x="1255" y="580" class="body" font-size="22"><tspan x="1255" dy="0">由夭鬼巷向左延伸至碧潭吊橋，</tspan><tspan x="1255" dy="31">沿途充滿傳統市場與攤販的活力。</tspan></text>

  <!-- bao -->
  <g transform="translate(545 620)">
    <rect x="0" y="0" width="155" height="70" fill="#f2d39a" stroke="#333" stroke-width="4"/><text x="78" y="43" text-anchor="middle" class="sign" font-size="28">楊家水煎包</text>
    <rect x="22" y="70" width="112" height="80" fill="#eee" stroke="#333" stroke-width="4"/><circle cx="48" cy="92" r="15" fill="#fff0c8" stroke="#333" stroke-width="3"/><circle cx="78" cy="88" r="15" fill="#fff0c8" stroke="#333" stroke-width="3"/><circle cx="105" cy="94" r="15" fill="#fff0c8" stroke="#333" stroke-width="3"/>
  </g>
  <rect x="545" y="760" width="250" height="42" rx="18" class="pill2"/><text x="670" y="790" text-anchor="middle" class="h" font-size="25">楊家水煎包的難忘滋味</text>
  <text x="545" y="825" class="body" font-size="22"><tspan x="545" dy="0">位於光明街太裕五金行旁，</tspan><tspan x="545" dy="31">是當時令人難忘的街頭美味。</tspan></text>

  <!-- lower-left simple map -->
  <g transform="translate(18 660)" opacity=".55"><path d="M35 120 C130 80 180 120 270 70 C330 40 400 60 485 20" class="line" stroke="#fff" stroke-width="13"/><path d="M60 190 C145 155 220 195 310 148 C380 115 430 145 500 105" class="line" stroke="#fff" stroke-width="13"/><path d="M120 35 L120 240 M220 45 L220 240 M335 25 L335 230 M440 40 L440 225" class="line" stroke="#fff" stroke-width="13"/><path d="M320 0 C350 80 340 150 380 230" class="line" stroke="#6cc4d8" stroke-width="16"/></g>
  <g transform="translate(55 815)"><rect x="0" y="0" width="85" height="52" rx="8" fill="#6eb0d3" stroke="#333" stroke-width="4" transform="rotate(-15 42 26)"/><circle cx="43" cy="26" r="13" fill="#ffe78b" stroke="#333" stroke-width="3"/></g>
</svg>
