<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg{fill:#d9eff8}.panel{fill:#eaf7fb;stroke:#2f6f88;stroke-width:3}.tag{fill:#114963;stroke:#7bd6ef;stroke-width:3}.title{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-weight:800;fill:#fff3c9;stroke:#163849;stroke-width:2;paint-order:stroke}.h{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-weight:800;fill:#fff}.t{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#12313a}.small{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#fff}.label{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-weight:700;fill:#12313a}.line{stroke:#245669;stroke-width:4;fill:none;stroke-linecap:round}.sign{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-weight:800;fill:#7b2b16}.note{fill:#12313a;font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-size:22px}
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc2e8"/><stop offset="1" stop-color="#eaf7fb"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17465c" flood-opacity=".35"/></filter>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect width="1600" height="900" fill="url(#sky)" opacity=".62"/>
  <path d="M0 690 C220 600 370 720 560 645 C745 575 890 720 1080 640 C1260 565 1420 660 1600 585 L1600 900 L0 900 Z" fill="#9ed6c6" opacity=".75"/>
  <path d="M0 770 C260 675 465 790 700 720 C940 650 1140 790 1385 705 C1490 668 1565 675 1600 690 L1600 900 L0 900 Z" fill="#73bfd0" opacity=".82"/>

  <rect x="365" y="18" width="870" height="70" rx="20" fill="#21536c" stroke="#9fdff2" stroke-width="3" filter="url(#shadow)"/>
  <text x="800" y="66" text-anchor="middle" class="title" font-size="38">穿越1970年代：新店舊時光生活圖鑑</text>

  <!-- top left theatre scene -->
  <g transform="translate(40 120)">
    <rect class="panel" width="520" height="300" rx="24"/>
    <rect x="18" y="18" width="275" height="54" rx="10" class="tag"/><text x="155" y="53" text-anchor="middle" class="h" font-size="25">雙大戲院時代：碧潭與伊士曼</text>
    <rect x="40" y="96" width="155" height="140" fill="#f5d8b0" stroke="#284e5f" stroke-width="4"/><rect x="58" y="112" width="120" height="36" fill="#f7ad52" stroke="#284e5f" stroke-width="3"/><text x="118" y="139" text-anchor="middle" class="sign" font-size="26">碧潭戲院</text>
    <rect x="290" y="90" width="170" height="150" fill="#f0c09d" stroke="#284e5f" stroke-width="4"/><rect x="308" y="106" width="134" height="38" fill="#f6d27b" stroke="#284e5f" stroke-width="3"/><text x="375" y="133" text-anchor="middle" class="sign" font-size="24">伊士曼戲院</text>
    <text x="42" y="273" class="t" font-size="22">當時新店僅有兩家戲院，分別位於</text><text x="42" y="300" class="t" font-size="22">碧潭市場上方與光明街內。</text>
    <rect x="130" y="248" width="126" height="36" rx="12" class="tag"/><text x="193" y="273" text-anchor="middle" class="h" font-size="22">碧潭市場</text>
  </g>

  <!-- top center admin -->
  <g transform="translate(590 115)">
    <rect class="panel" width="420" height="310" rx="24"/>
    <rect x="58" y="18" width="305" height="54" rx="10" class="tag"/><text x="210" y="53" text-anchor="middle" class="h" font-size="26">城市地標與娛樂空間</text>
    <rect x="95" y="130" width="230" height="130" fill="#e8d4b3" stroke="#24495a" stroke-width="4"/><rect x="130" y="92" width="160" height="48" fill="#f2e7c5" stroke="#24495a" stroke-width="4"/><text x="210" y="123" text-anchor="middle" class="label" font-size="20">新店鎮公所</text>
    <rect x="120" y="178" width="52" height="82" fill="#c8e2e8" stroke="#24495a" stroke-width="3"/><rect x="248" y="178" width="52" height="82" fill="#c8e2e8" stroke="#24495a" stroke-width="3"/><rect x="185" y="185" width="50" height="75" fill="#b2ccd8" stroke="#24495a" stroke-width="3"/>
    <circle cx="82" cy="106" r="28" fill="#f8e28a" stroke="#24495a" stroke-width="3"/><text x="82" y="151" text-anchor="middle" class="label" font-size="18">公路局</text>
    <circle cx="165" cy="86" r="28" fill="#f8e28a" stroke="#24495a" stroke-width="3"/><text x="165" y="75" text-anchor="middle" class="label" font-size="16">警</text><text x="165" y="131" text-anchor="middle" class="label" font-size="18">警察局</text>
    <circle cx="250" cy="86" r="28" fill="#f8e28a" stroke="#24495a" stroke-width="3"/><text x="250" y="131" text-anchor="middle" class="label" font-size="18">戶政</text>
    <circle cx="338" cy="106" r="28" fill="#f8e28a" stroke="#24495a" stroke-width="3"/><text x="338" y="151" text-anchor="middle" class="label" font-size="18">地政事務所</text>
    <rect x="90" y="262" width="240" height="36" rx="12" class="tag"/><text x="210" y="287" text-anchor="middle" class="h" font-size="22">行政核心：新店鎮公所</text>
  </g>

  <!-- top right dorm -->
  <g transform="translate(1040 120)">
    <rect class="panel" width="520" height="300" rx="24"/>
    <rect x="105" y="18" width="345" height="54" rx="10" class="tag"/><text x="278" y="53" text-anchor="middle" class="h" font-size="24">消失的空間：新店國小教師宿舍</text>
    <rect x="110" y="105" width="265" height="118" fill="#d7c59e" stroke="#254b5e" stroke-width="4"/><path d="M88 105 L242 38 L398 105 Z" fill="#b78c61" stroke="#254b5e" stroke-width="4"/><rect x="140" y="130" width="45" height="62" fill="#b7d7dd" stroke="#254b5e" stroke-width="3"/><rect x="220" y="130" width="45" height="62" fill="#b7d7dd" stroke="#254b5e" stroke-width="3"/><rect x="300" y="130" width="45" height="62" fill="#b7d7dd" stroke="#254b5e" stroke-width="3"/>
    <path d="M420 70 C455 110 455 168 420 225" class="line" stroke="#6da05e"/><path d="M438 90 L485 70 M442 120 L496 112 M442 155 L490 160" class="line" stroke="#6da05e"/>
    <text x="58" y="260" class="t" font-size="22">位於學校右側的舊建築，現已因</text><text x="58" y="287" class="t" font-size="22">校園整建與時代變遷而消失。</text>
  </g>

  <!-- bottom left students -->
  <g transform="translate(40 455)">
    <rect class="panel" width="520" height="385" rx="24"/>
    <rect x="72" y="18" width="380" height="54" rx="10" class="tag"/><text x="262" y="53" text-anchor="middle" class="h" font-size="26">學生日常：週三與週六的半天假</text>
    <circle cx="110" cy="238" r="42" fill="#ffd7a0" stroke="#284e5f" stroke-width="4"/><rect x="82" y="280" width="56" height="74" fill="#ffffff" stroke="#284e5f" stroke-width="4"/><line x1="80" y1="326" x2="45" y2="356" class="line"/><line x1="140" y1="326" x2="178" y2="356" class="line"/>
    <circle cx="230" cy="230" r="42" fill="#ffd7a0" stroke="#284e5f" stroke-width="4"/><rect x="202" y="272" width="56" height="78" fill="#ffffff" stroke="#284e5f" stroke-width="4"/>
    <circle cx="345" cy="238" r="42" fill="#ffd7a0" stroke="#284e5f" stroke-width="4"/><rect x="317" y="280" width="56" height="74" fill="#ffffff" stroke="#284e5f" stroke-width="4"/>
    <rect x="255" y="115" width="180" height="80" fill="#6e9b72" stroke="#284e5f" stroke-width="5"/><circle cx="315" cy="154" r="8" fill="#c54b3c"/><circle cx="335" cy="154" r="8" fill="#fff"/><circle cx="355" cy="154" r="8" fill="#222"/>
    <text x="52" y="110" class="t" font-size="22">學生多在半天課後前往「夭鬼巷」，</text><text x="52" y="137" class="t" font-size="22">打撞球、逛街休閒。</text>
  </g>

  <!-- bottom center life map -->
  <g transform="translate(590 455)">
    <rect class="panel" width="420" height="385" rx="24"/>
    <rect x="40" y="18" width="340" height="54" rx="10" class="tag"/><text x="210" y="53" text-anchor="middle" class="h" font-size="27">生活記憶與美食地圖</text>
    <path d="M55 200 L130 140 L205 200 L205 310 L55 310 Z" fill="#d9b58a" stroke="#284e5f" stroke-width="4"/><path d="M205 200 L292 142 L365 204 L365 310 L205 310 Z" fill="#cbb09d" stroke="#284e5f" stroke-width="4"/><rect x="75" y="222" width="38" height="60" fill="#80b9c8" stroke="#284e5f" stroke-width="3"/><rect x="235" y="222" width="38" height="60" fill="#80b9c8" stroke="#284e5f" stroke-width="3"/>
    <rect x="58" y="310" width="320" height="38" rx="12" class="tag"/><text x="218" y="336" text-anchor="middle" class="h" font-size="22">夭鬼巷的鐵皮屋百攤</text>
    <text x="54" y="365" class="t" font-size="20">由鐵皮屋構成的小巷，充滿小吃、</text><text x="54" y="390" class="t" font-size="20">小物與算命等生活攤位。</text>
  </g>

  <!-- bottom right bao -->
  <g transform="translate(1040 455)">
    <rect class="panel" width="520" height="385" rx="24"/>
    <rect x="92" y="88" width="230" height="170" fill="#e9c48e" stroke="#284e5f" stroke-width="5"/><rect x="110" y="105" width="190" height="46" fill="#fff1c8" stroke="#284e5f" stroke-width="4"/><text x="205" y="139" text-anchor="middle" class="sign" font-size="32">太裕五金行</text>
    <circle cx="395" cy="230" r="45" fill="#ffd7a0" stroke="#284e5f" stroke-width="4"/><rect x="350" y="272" width="90" height="80" fill="#f2a6a6" stroke="#284e5f" stroke-width="4"/><path d="M336 165 C370 120 425 120 460 165" class="line" stroke="#fff"/><circle cx="336" cy="165" r="26" fill="#fff3dc" stroke="#284e5f" stroke-width="4"/><circle cx="385" cy="150" r="26" fill="#fff3dc" stroke="#284e5f" stroke-width="4"/><circle cx="435" cy="165" r="26" fill="#fff3dc" stroke="#284e5f" stroke-width="4"/>
    <rect x="250" y="18" width="245" height="54" rx="10" class="tag"/><text x="372" y="53" text-anchor="middle" class="h" font-size="24">太裕五金行的楊家水煎包</text>
    <text x="52" y="320" class="t" font-size="22">位在光明街，是當地難忘的老味道，</text><text x="52" y="348" class="t" font-size="22">見證了街區的飲食變遷。</text>
  </g>
</svg>
